name: ClickHouse Test TS

on:
  workflow_dispatch:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MYSQL_HOST: mysql-host-ts
  CLICKHOUSE_HOST: clickhouse-host-ts
  REDIS_HOST: redis-host-ts
  MYSQL_PORT: 3306
  CLICKHOUSE_PORT: 8123
  REDIS_PORT: 6379

jobs:

  provision_redis:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTH_KEY }}
        tags: tag:ci
        retry: 3
        hostname: ${{ env.REDIS_HOST }}

    - name: Docker compose Redis
      shell: bash
      working-directory: ./infra/redis
      run: |
        docker compose up --build -d

    - name: Checking REDIS
      working-directory: ./utils/controller
      shell: bash
      run: |
        pip install -r requirements.txt
        timeout 60s bash -c '
        until 
          python3 main.py ping; 
          do 
            echo "Waiting for REDIS"; 
            sleep 2; 
          done;
        '
    
    - name: Submit and forget
      working-directory: ./utils/controller
      shell: bash
      run: |
        python3 main.py start --dep $REDIS_HOST --job main
        until 
          python3 main.py term --dep $REDIS_HOST
          do 
            echo "Waiting to finish $REDIS_HOST"; 
            sleep 2; 
          done;

  provision_clickhouse_server:
    env:
      DATA_SOURCE_IMG: "ecommerce:latest"
      ETL_IMG: "etl:latest"
      REPORTER_IMG: "reporter:latest"
      NETWORK_NAME: analytics_network
    
    runs-on: ubuntu-22.04

    steps:
    
    - uses: actions/checkout@v4

    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTH_KEY }}
        tags: tag:ci
        retry: 3
        hostname: ${{ env.CLICKHOUSE_HOST }}

    - name: Create docker network
      shell: bash
      run: docker network create --attachable --driver bridge $NETWORK_NAME

    - name: Create SSH TS
      shell: bash
      run: sudo tailscale set --ssh
    
    - name: Verify network
      shell: bash
      run: |
        NET_DATA=$(docker network ls --filter "NAME=$NETWORK_NAME" --format json | jq)
        if [[ $NET_DATA == "" ]]; then 
          echo "Network not found"
          exit 1; 
        else 
          echo "$NET_DATA"
        fi
    
    - name: Create .env file for Clickhouse
      working-directory: ./infra/clickhouse
      shell: bash
      run: |
        echo "CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}" >> .env
        echo "CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}" >> .env
        docker compose up --build -d

    - name: Checking REDIS
      working-directory: ./utils/controller
      shell: bash
      run: |
        pip install -r requirements.txt
        timeout 60s bash -c '
        until 
          python3 main.py ping; 
          do 
            echo "Waiting for REDIS"; 
            sleep 2; 
          done;
        '

    - name: Submit and forget
      working-directory: ./utils/controller
      shell: bash
      run: |
        python3 main.py start --dep $CLICKHOUSE_HOST --job main
        until 
          python3 main.py term --dep $CLICKHOUSE_HOST
          do 
            echo "Waiting to finish $CLICKHOUSE_HOST"; 
            sleep 2; 
          done;

  verify_clickhouse:
    
    runs-on: ubuntu-22.04
    
    steps:
    
    - uses: actions/checkout@v4

    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTH_KEY }}
        tags: tag:ci
        retry: 3  
    
    - name: Checking ClickHouse
      shell: bash
      run: |
        echo "CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}" >> .env
        echo "CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}" >> .env
        echo "CLICKHOUSE_HOST=$CLICKHOUSE_HOST" >> .env
        echo "CLICKHOUSE_PORT=$CLICKHOUSE_PORT" >> .env
        timeout 120s bash -c '
        until
          source .env;
          DATA=$(curl -s -H "X-ClickHouse-User: $CLICKHOUSE_USER" -H "X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" --data "SELECT 3.14;" "http://$CLICKHOUSE_HOST:$CLICKHOUSE_PORT/"); 
            do
              echo "Waiting for ClickHouse";
              sleep 2;
            done;
            echo $DATA
        '
