name: Test TailScale

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_tailscale:
    runs-on: ubuntu-22.04
    
    env:
      NETWORK_NAME: analytics_network
      CLICKHOUSE_HOST: clickhouse-host
      CLICKHOUSE_PORT: 8123

    steps:
    
    - uses: actions/checkout@v4

    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTH_KEY }}
        tags: tag:ci
        retry: 2
        hostname: clickhouse-host

    - name: Create docker network
      shell: bash
      run: docker network create --attachable --driver bridge $NETWORK_NAME
    
    - name: Verify network
      shell: bash
      run: |
        NET_DATA=$(docker network ls --filter "NAME=$NETWORK_NAME" --format json | jq)
        if [[ $NET_DATA == "" ]]; then 
          echo "Network not found"
          exit 1; 
        else 
          echo "$NET_DATA"
        fi
    
    - name: Create .env file for Clickhouse
      working-directory: ./infra/clickhouse
      shell: bash
      run: |
        echo "CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}" >> .env
        echo "CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}" >> .env
        docker compose up --build -d
    
    - name: Wait
      shell: bash
      run: sleep 60
  
  check_clickhouse:
    
    runs-on: ubuntu-22.04
    
    env:
      CLICKHOUSE_HOST: clickhouse-host
      CLICKHOUSE_PORT: 8123
      REPORTER_IMG: "reporter:latest"
      NETWORK_NAME: host_net
    
    steps:

    - uses: actions/checkout@v4

    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTH_KEY }}
        tags: tag:ci
        retry: 2
        hostname: client-host
    
    - name: Create docker network
      shell: bash
      run: docker network create --attachable --driver host $NETWORK_NAME
    
    - name: Verify network
      shell: bash
      run: |
        NET_DATA=$(docker network ls --filter "NAME=$NETWORK_NAME" --format json | jq)
        if [[ $NET_DATA == "" ]]; then 
          echo "Network not found"
          exit 1; 
        else 
          echo "$NET_DATA"
        fi    
    
    - name: Bulid Reporter
      shell: bash
      working-directory: ./services/reporter
      run: |
        docker build -t $REPORTER_IMG .

    - name: Checking ClickHouse
      shell: bash
      run: |
        echo "CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}" >> .env
        echo "CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}" >> .env
        echo "CLICKHOUSE_HOST=$CLICKHOUSE_HOST" >> .env
        echo "CLICKHOUSE_PORT=$CLICKHOUSE_PORT" >> .env
        timeout 120s bash -c '
        until
          source .env;
          DATA=$(curl -s -H "X-ClickHouse-User: $CLICKHOUSE_USER" -H "X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" --data "SELECT 3.14;" "http://clickhouse-host:$CLICKHOUSE_PORT/"); 
            do
              echo "Waiting for ClickHouse";
              sleep 2;
            done;
            echo $DATA
        '
    
    - name: Run reporter in clickhouse
      shell: bash
      working-directory: ./services/reporter/
      env:
        DB_DRIVER: "clickhouse"
        QUERY: "SELECT 3.14"
      run: | 
        mkdir -p data
        echo '{"driver": "${{ env.DB_DRIVER }}", "query": "${{ env.QUERY }}"}' > data/config.json
        docker run \
          --network $NETWORK_NAME \
          --env CLICKHOUSE_HOST=$CLICKHOUSE_HOST \
          --env CLICKHOUSE_PORT=$CLICKHOUSE_PORT \
          --env CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }} \
          --env CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }} \
          --volume ./data/:/reporter/data \
          $REPORTER_IMG --file data/config.json